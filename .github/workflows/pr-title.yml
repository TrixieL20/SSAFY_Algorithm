name: Set PR Title

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  set-title:
    runs-on: ubuntu-latest

    steps:
      - name: Set PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          DATE="${BRANCH_NAME%%_*}"
          INITIAL="${BRANCH_NAME#*_}"

          case "$INITIAL" in
            CIY)
              NAME="최인영"
              ;;
            PSH)
              NAME="박소현"
              ;;
            HYJ)
              NAME="황윤주"
              ;;
            HDG)
              NAME="한동건"
              ;;
            LMJ)
              NAME="이민정"
              ;;
            SSY)
              NAME="신수연"
              ;;
            *)
              NAME="$INITIAL"
              ;;
          esac

          TITLE="$DATE $NAME 문제 풀이"

          echo "Branch: $BRANCH_NAME"
          echo "Date: $DATE"
          echo "Initial: $INITIAL"
          echo "Name: $NAME"
          echo "Title: $TITLE"

          gh pr edit "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --title "$TITLE"
